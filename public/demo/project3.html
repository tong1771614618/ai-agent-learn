<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目3: AI 搜索引擎 (RAG)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f7f8; height: 100vh; display: flex; flex-direction: column; }

        .header { background: #1a1a2e; color: white; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
        .header .badge { background: #0d9488; font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
        .header h1 { font-size: 16px; font-weight: 600; }
        .header p { font-size: 12px; color: #888; margin-left: auto; }

        .chat-area { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .msg-user { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        .msg-user .bubble { background: #4361ee; color: white; padding: 10px 16px; border-radius: 16px 16px 4px 16px; font-size: 14px; max-width: 60%; line-height: 1.5; }
        .msg-ai { margin-bottom: 20px; max-width: 85%; }

        /* 步骤面板 */
        .steps-panel { background: white; border: 1px solid #e8e8ec; border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
        .steps-header { display: flex; align-items: center; padding: 10px 14px; background: #fafafa; border-bottom: 1px solid #e8e8ec; cursor: pointer; user-select: none; }
        .steps-header:hover { background: #f0f0f5; }
        .steps-header .toggle-icon { font-size: 12px; color: #999; margin-right: 8px; transition: transform 0.2s; }
        .steps-header .toggle-icon.collapsed { transform: rotate(-90deg); }
        .steps-header .steps-summary { font-size: 12px; color: #666; }
        .steps-header .total-time { margin-left: auto; font-size: 11px; color: #999; font-family: "SF Mono", "Menlo", monospace; }
        .steps-body { overflow: hidden; transition: max-height 0.3s ease; }
        .steps-body.collapsed { max-height: 0 !important; }

        .step { display: flex; align-items: flex-start; padding: 8px 14px; border-bottom: 1px solid #f0f0f2; opacity: 0; transform: translateY(-4px); transition: opacity 0.3s, transform 0.3s; }
        .step.visible { opacity: 1; transform: translateY(0); }
        .step:last-child { border-bottom: none; }
        .step .step-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; margin-right: 10px; margin-top: 1px; }
        .step .step-icon.done { background: #e8f5e9; color: #43a047; }
        .step .step-icon.running { background: #fff3e0; color: #fb8c00; }
        .step .step-icon.rag { background: #e0f2f1; color: #0d9488; }
        .step .step-info { flex: 1; min-width: 0; }
        .step .step-name { font-size: 13px; color: #333; font-weight: 500; }
        .step .step-time { font-size: 11px; color: #999; font-family: "SF Mono", "Menlo", monospace; margin-left: 6px; }
        .step .step-detail { margin-top: 6px; font-size: 12px; color: #555; background: #f7f7f8; border-radius: 6px; padding: 8px 10px; font-family: "SF Mono", "Menlo", monospace; line-height: 1.6; max-height: 200px; overflow-y: auto; display: none; white-space: pre-wrap; word-break: break-all; }
        .step.expanded .step-detail { display: block; }
        .step .step-row { cursor: pointer; display: flex; align-items: center; }
        .step .step-row:hover .step-name { color: #0d9488; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 14px; height: 14px; border: 2px solid #ffe0b2; border-top-color: #fb8c00; border-radius: 50%; animation: spin 0.6s linear infinite; }

        /* 结果区域 */
        .result-area { background: white; border: 1px solid #e8e8ec; border-radius: 12px; padding: 16px; opacity: 0; transform: translateY(6px); transition: opacity 0.4s, transform 0.4s; }
        .result-area.visible { opacity: 1; transform: translateY(0); }
        .agent-answer { font-size: 14px; color: #333; line-height: 1.8; white-space: pre-wrap; }
        .agent-answer strong { color: #1a1a2e; }

        /* 来源卡片 */
        .sources-section { margin-top: 14px; border-top: 1px solid #eee; padding-top: 12px; }
        .sources-title { font-size: 12px; color: #888; margin-bottom: 8px; }
        .source-card { background: #f7f7f8; border: 1px solid #e8e8ec; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s; }
        .source-card:hover { border-color: #0d9488; }
        .source-card .source-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .source-card .source-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; color: white; }
        .source-card .source-badge.PHP { background: #777bb4; }
        .source-card .source-badge.LINUX { background: #333; }
        .source-card .source-badge.MYSQL { background: #00758f; }
        .source-card .source-badge.NET { background: #e44d26; }
        .source-card .source-badge.REDIS { background: #dc382d; }
        .source-card .source-score { font-size: 11px; color: #0d9488; font-family: "SF Mono", "Menlo", monospace; margin-left: auto; }
        .source-card .source-preview { font-size: 12px; color: #666; line-height: 1.5; max-height: 40px; overflow: hidden; transition: max-height 0.3s; }
        .source-card.expanded .source-preview { max-height: 500px; overflow-y: auto; }

        /* 错误卡片 */
        .err-card { border-color: #ffcdd2 !important; background: #fff5f5 !important; }
        .err-summary { color: #c62828; font-size: 13px; line-height: 1.5; }
        .err-detail { margin-top: 8px; cursor: pointer; }
        .err-detail pre { display: none; margin-top: 6px; font-size: 11px; color: #555; background: #f7f7f8; border-radius: 6px; padding: 8px 10px; font-family: "SF Mono", "Menlo", monospace; line-height: 1.6; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .err-detail.expanded pre { display: block; }
        .err-detail.expanded .err-toggle { transform: rotate(90deg); }
        .err-toggle { font-size: 12px; color: #999; transition: transform 0.2s; display: inline-block; }

        .loading-card { background: white; border: 1px solid #e8e8ec; border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 10px; }
        .loading-card .spinner-lg { width: 18px; height: 18px; border: 2px solid #e0e0e0; border-top-color: #0d9488; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .loading-card span { font-size: 13px; color: #888; }

        .input-area { padding: 14px 24px; background: white; border-top: 1px solid #e8e8ec; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 10px 16px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .input-area input:focus { border-color: #0d9488; }
        .input-area button { padding: 10px 24px; background: #0d9488; color: white; border: none; border-radius: 20px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .input-area button:hover { background: #0a7a70; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }

        .quick-asks { padding: 8px 24px; display: flex; gap: 8px; flex-wrap: wrap; }
        .quick-asks button { padding: 6px 14px; background: white; border: 1px solid #ddd; border-radius: 16px; font-size: 12px; cursor: pointer; color: #555; transition: all 0.2s; }
        .quick-asks button:hover { background: #e0f2f1; border-color: #0d9488; color: #0d9488; }

        .welcome { background: white; border: 1px solid #e8e8ec; border-radius: 12px; padding: 20px; max-width: 500px; margin: 40px auto; text-align: center; }
        .welcome h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 8px; }
        .welcome p { font-size: 13px; color: #666; line-height: 1.7; }
        .welcome .flow { margin-top: 14px; font-size: 12px; color: #0d9488; font-family: "SF Mono", "Menlo", monospace; background: #e0f2f1; border-radius: 8px; padding: 10px; line-height: 1.8; }
        .welcome .compare { margin-top: 12px; font-size: 12px; color: #888; text-align: left; }
        .welcome .compare span.old { color: #999; text-decoration: line-through; }
        .welcome .compare span.new { color: #0d9488; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <span class="badge">项目 3</span>
        <h1>AI 搜索引擎 (RAG)</h1>
        <p>Embedding + 向量检索 + 上下文注入</p>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="welcome">
            <h2>AI 搜索引擎 (RAG)</h2>
            <p>与项目 1/2 不同，这里的 AI 不是凭空回答——它先从<strong>知识库</strong>中检索相关知识，再基于知识生成回答。这就是 <strong>RAG</strong>（检索增强生成）。</p>
            <div class="flow">
                用户提问 → Embedding(问题→向量)<br>
                → ChromaDB 向量检索(Top-K)<br>
                → 注入上下文到 Prompt<br>
                → LLM 基于知识生成回答
            </div>
            <div class="compare">
                <div><span class="old">项目1/2: LLM 靠训练数据回答（可能有幻觉）</span></div>
                <div><span class="new">项目3: 先检索知识 → 再基于知识回答（可溯源）</span></div>
            </div>
        </div>
    </div>

    <div class="quick-asks" id="quickAsks"></div>

    <div class="input-area">
        <input type="text" id="queryInput" placeholder="问一个技术问题..." onkeydown="if(event.key==='Enter')sendQuery()">
        <button id="sendBtn" onclick="sendQuery()">搜索</button>
    </div>

    <script>
    const PROJECT_CONFIG = {
        apiUrl: '/api/v3/search',
        requestBody: (text) => ({ query: text }),

        quickAsks: [
            'PHP的垃圾回收机制是什么？',
            'MySQL的B+树索引和B树有什么区别？',
            'Linux管道和命名管道有什么区别？',
            'PHP-FPM有哪几种进程管理模式？',
            '什么是FastCGI协议？',
        ],

        buildSteps: (data) => {
            const steps = [];

            // PHP 侧步骤
            for (const s of (data._steps || [])) {
                steps.push({ name: s.name, duration_ms: s.duration_ms, detail: s.detail, icon: 'done' });
            }

            return steps;
        },

        stepRenderers: {
            '接收请求': (d) => `query: "${d.query}"`,
            'RAG 搜索': (d) => `检索到 ${d.retrieved_count} / ${d.total_chunks} 个知识片段`,
        },

        defaultStepRenderer: (detail) => JSON.stringify(detail, null, 2),

        // 结果渲染 — RAG 回答 + 来源引用卡片
        renderResult: (data) => {
            const answer = data.answer || '没有收到回答';
            let html = answer
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            // 来源卡片
            const sources = data.sources || [];
            if (sources.length > 0) {
                html += `<div class="sources-section">`;
                html += `<div class="sources-title">引用来源 (${sources.length} 个知识片段)</div>`;
                for (const s of sources) {
                    const category = s.category || 'OTHER';
                    const scorePercent = (s.score * 100).toFixed(1);
                    const preview = (s.text || '').slice(0, 300);
                    html += `<div class="source-card" onclick="this.classList.toggle('expanded')">
                        <div class="source-header">
                            <span class="source-badge ${category}">${category}</span>
                            <span style="font-size:11px;color:#888">${esc(s.source || '')}</span>
                            <span class="source-score">${scorePercent}%</span>
                        </div>
                        <div class="source-preview">${esc(preview)}</div>
                    </div>`;
                }
                html += `</div>`;
            }

            return `<div class="agent-answer">${html}</div>`;
        },
    };

    // ═══════════════════════════════════════════════════════
    // 通用引擎
    // ═══════════════════════════════════════════════════════

    (function init() {
        const container = document.getElementById('quickAsks');
        PROJECT_CONFIG.quickAsks.forEach(text => {
            const btn = document.createElement('button');
            btn.textContent = text.length > 14 ? text.slice(0, 14) + '…' : text;
            btn.onclick = () => { document.getElementById('queryInput').value = text; sendQuery(); };
            container.appendChild(btn);
        });
    })();

    async function sendQuery() {
        const input = document.getElementById('queryInput');
        const query = input.value.trim();
        if (!query) return;
        input.value = '';

        const welcome = document.querySelector('.welcome');
        if (welcome) welcome.remove();

        appendUserMsg(query);
        const loadingEl = appendLoading();
        document.getElementById('sendBtn').disabled = true;

        try {
            const body = PROJECT_CONFIG.requestBody ? PROJECT_CONFIG.requestBody(query) : { query };
            const resp = await fetch(PROJECT_CONFIG.apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(body),
            });
            let data;
            try { data = await resp.json(); } catch { data = null; }
            loadingEl.remove();

            if (!resp.ok) {
                appendErrorMsg(data?.message || data?.error || `HTTP ${resp.status}`, data);
            } else if (data?.error) {
                appendErrorMsg(data.error, data);
            } else {
                await animateResponse(data);
            }
        } catch (e) {
            loadingEl.remove();
            appendErrorMsg('网络请求失败: ' + e.message, { hint: '请确认 Python AI Service 是否在运行 (port 8001)' });
        }
        document.getElementById('sendBtn').disabled = false;
    }

    async function animateResponse(data) {
        const chat = document.getElementById('chatArea');

        const steps = PROJECT_CONFIG.buildSteps ? PROJECT_CONFIG.buildSteps(data) : (data._steps || []);
        const totalTime = steps.reduce((s, st) => s + (st.duration_ms || 0), 0);

        const aiDiv = document.createElement('div');
        aiDiv.className = 'msg-ai';

        const panel = document.createElement('div');
        panel.className = 'steps-panel';

        const header = document.createElement('div');
        header.className = 'steps-header';
        header.innerHTML = `
            <span class="toggle-icon">▼</span>
            <span class="steps-summary">${steps.length} 个步骤</span>
            <span class="total-time">${totalTime ? totalTime + 'ms' : ''}</span>`;
        panel.appendChild(header);

        const body = document.createElement('div');
        body.className = 'steps-body';

        const stepEls = steps.map((step) => {
            const el = document.createElement('div');
            el.className = 'step';

            const renderer = PROJECT_CONFIG.stepRenderers[step.name];
            const detailData = step.detail || {};
            const detailText = renderer ? renderer(detailData) : (PROJECT_CONFIG.defaultStepRenderer ? PROJECT_CONFIG.defaultStepRenderer(detailData) : JSON.stringify(detailData, null, 2));

            const iconClass = step.icon || 'running';
            const iconContent = iconClass === 'rag' ? '🔍' : iconClass === 'done' ? '✓' : '<div class="spinner"></div>';

            el.innerHTML = `
                <div class="step-icon ${iconClass}">${iconContent}</div>
                <div class="step-info">
                    <div class="step-row">
                        <span class="step-name">${esc(step.name)}</span>
                        <span class="step-time">${step.duration_ms ? step.duration_ms + 'ms' : ''}</span>
                    </div>
                    <div class="step-detail">${esc(detailText)}</div>
                </div>`;
            body.appendChild(el);
            return el;
        });

        panel.appendChild(body);
        aiDiv.appendChild(panel);

        const resultDiv = document.createElement('div');
        resultDiv.className = 'result-area';
        resultDiv.innerHTML = PROJECT_CONFIG.renderResult(data);
        aiDiv.appendChild(resultDiv);

        chat.appendChild(aiDiv);
        chat.scrollTop = chat.scrollHeight;

        for (let i = 0; i < stepEls.length; i++) {
            const el = stepEls[i];
            await delay(80);
            el.classList.add('visible');
            chat.scrollTop = chat.scrollHeight;

            if (steps[i].icon === 'running') {
                const animTime = Math.min(600, Math.max(200, (steps[i].duration_ms || 300) * 0.3));
                await delay(animTime);
                const icon = el.querySelector('.step-icon');
                icon.className = 'step-icon done';
                icon.innerHTML = '✓';
            } else {
                await delay(120);
            }
        }

        stepEls.forEach(el => {
            el.querySelector('.step-row').addEventListener('click', () => {
                el.classList.toggle('expanded');
            });
        });

        let collapsed = false;
        header.addEventListener('click', () => {
            collapsed = !collapsed;
            body.classList.toggle('collapsed', collapsed);
            header.querySelector('.toggle-icon').classList.toggle('collapsed', collapsed);
            header.querySelector('.steps-summary').textContent =
                collapsed ? `${steps.length} 个步骤（已折叠）` : `${steps.length} 个步骤已完成`;
        });

        collapsed = true;
        body.classList.add('collapsed');
        header.querySelector('.toggle-icon').classList.add('collapsed');
        header.querySelector('.steps-summary').textContent = `${steps.length} 个步骤 · 点击展开`;

        await delay(150);
        resultDiv.classList.add('visible');
        chat.scrollTop = chat.scrollHeight;
    }

    function appendUserMsg(text) {
        const chat = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg-user';
        div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function appendLoading() {
        const chat = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg-ai';
        div.innerHTML = `<div class="loading-card"><div class="spinner-lg"></div><span>正在检索知识库并生成回答...</span></div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function appendErrorMsg(summary, detail) {
        const chat = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg-ai';
        let detailHtml = '';
        if (detail) {
            const lines = [];
            if (detail.exception) lines.push(`异常: ${detail.exception}`);
            if (detail.file) lines.push(`文件: ${detail.file}`);
            if (detail.line) lines.push(`行号: ${detail.line}`);
            if (detail.hint) lines.push(`提示: ${detail.hint}`);
            const detailText = lines.length ? lines.join('\n') : JSON.stringify(detail, null, 2);
            detailHtml = `<div class="err-detail" onclick="this.classList.toggle('expanded')">
                <span class="err-toggle">▸ 查看详情</span>
                <pre>${esc(detailText)}</pre>
            </div>`;
        }
        div.innerHTML = `<div class="result-area visible err-card">
            <div class="err-summary">⚠ ${esc(summary)}</div>${detailHtml}
        </div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

    function esc(str) {
        const d = document.createElement('div');
        d.textContent = str ?? '';
        return d.innerHTML;
    }
    </script>
</body>
</html>
