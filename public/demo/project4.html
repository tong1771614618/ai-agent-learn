<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目4: 售后 Agent (HITL)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f7f8; height: 100vh; display: flex; flex-direction: column; }

        .header { background: #1a1a2e; color: white; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
        .header .badge { background: #e67e22; font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
        .header h1 { font-size: 16px; font-weight: 600; }
        .header p { font-size: 12px; color: #888; margin-left: auto; }

        .chat-area { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .msg-user { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        .msg-user .bubble { background: #e67e22; color: white; padding: 10px 16px; border-radius: 16px 16px 4px 16px; font-size: 14px; max-width: 60%; line-height: 1.5; }
        .msg-ai { margin-bottom: 20px; max-width: 85%; }

        /* Steps panel */
        .steps-panel { background: white; border: 1px solid #e8e8ec; border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
        .steps-header { display: flex; align-items: center; padding: 10px 14px; background: #fafafa; border-bottom: 1px solid #e8e8ec; cursor: pointer; user-select: none; }
        .steps-header:hover { background: #f0f0f5; }
        .steps-header .toggle-icon { font-size: 12px; color: #999; margin-right: 8px; transition: transform 0.2s; }
        .steps-header .toggle-icon.collapsed { transform: rotate(-90deg); }
        .steps-header .steps-summary { font-size: 12px; color: #666; }
        .steps-header .total-time { margin-left: auto; font-size: 11px; color: #999; font-family: "SF Mono", "Menlo", monospace; }
        .steps-body { overflow: hidden; transition: max-height 0.3s ease; }
        .steps-body.collapsed { max-height: 0 !important; }

        .step { display: flex; align-items: flex-start; padding: 8px 14px; border-bottom: 1px solid #f0f0f2; opacity: 0; transform: translateY(-4px); transition: opacity 0.3s, transform 0.3s; }
        .step.visible { opacity: 1; transform: translateY(0); }
        .step:last-child { border-bottom: none; }
        .step .step-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; margin-right: 10px; margin-top: 1px; }
        .step .step-icon.done { background: #e8f5e9; color: #43a047; }
        .step .step-icon.running { background: #fff3e0; color: #e67e22; }
        .step .step-icon.tool { background: #fff3e0; color: #e67e22; }
        .step .step-icon.result { background: #e3f2fd; color: #1976d2; }
        .step .step-icon.answer { background: #e8f5e9; color: #43a047; }
        .step .step-info { flex: 1; min-width: 0; }
        .step .step-name { font-size: 13px; color: #333; font-weight: 500; }
        .step .step-time { font-size: 11px; color: #999; font-family: "SF Mono", "Menlo", monospace; margin-left: 6px; }
        .step .step-detail { margin-top: 6px; font-size: 12px; color: #555; background: #f7f7f8; border-radius: 6px; padding: 8px 10px; font-family: "SF Mono", "Menlo", monospace; line-height: 1.6; max-height: 200px; overflow-y: auto; display: none; white-space: pre-wrap; word-break: break-all; }
        .step.expanded .step-detail { display: block; }
        .step .step-row { cursor: pointer; display: flex; align-items: center; }
        .step .step-row:hover .step-name { color: #e67e22; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 14px; height: 14px; border: 2px solid #ffe0b2; border-top-color: #e67e22; border-radius: 50%; animation: spin 0.6s linear infinite; }

        /* Result area */
        .result-area { background: white; border: 1px solid #e8e8ec; border-radius: 12px; padding: 16px; opacity: 0; transform: translateY(6px); transition: opacity 0.4s, transform 0.4s; }
        .result-area.visible { opacity: 1; transform: translateY(0); }
        .agent-answer { font-size: 14px; color: #333; line-height: 1.8; white-space: pre-wrap; }
        .agent-answer strong { color: #1a1a2e; }

        /* ═══ Approval Panel ═══ */
        @keyframes approvalSlideIn {
            from { opacity: 0; transform: translateY(16px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes approvalPulse {
            0%, 100% { box-shadow: 0 4px 20px rgba(230, 126, 34, 0.15); }
            50% { box-shadow: 0 4px 28px rgba(230, 126, 34, 0.28); }
        }
        .approval-panel {
            background: white;
            border: 2px solid #e67e22;
            border-left: 5px solid #e67e22;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 8px;
            animation: approvalSlideIn 0.45s ease-out, approvalPulse 2s ease-in-out 0.5s 2;
            box-shadow: 0 4px 20px rgba(230, 126, 34, 0.15);
            transition: border-color 0.4s, box-shadow 0.4s;
        }
        .approval-panel.approved {
            border-color: #43a047;
            border-left-color: #43a047;
            box-shadow: 0 4px 20px rgba(67, 160, 71, 0.12);
            animation: approvalSlideIn 0.45s ease-out;
        }
        .approval-panel.rejected {
            border-color: #e53935;
            border-left-color: #e53935;
            box-shadow: 0 4px 20px rgba(229, 57, 53, 0.12);
            animation: approvalSlideIn 0.45s ease-out;
        }

        .approval-header {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #f0d9b5;
        }
        .approval-panel.approved .approval-header { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-bottom-color: #a5d6a7; }
        .approval-panel.rejected .approval-header { background: linear-gradient(135deg, #ffebee, #ffcdd2); border-bottom-color: #ef9a9a; }

        .approval-header-icon { font-size: 22px; line-height: 1; }
        .approval-header-text { font-size: 15px; font-weight: 700; color: #1a1a2e; }
        .approval-header-sub { font-size: 11px; color: #888; margin-left: auto; }

        .approval-body { padding: 18px; }
        .approval-field { display: flex; align-items: baseline; margin-bottom: 12px; font-size: 13px; line-height: 1.6; }
        .approval-field:last-of-type { margin-bottom: 0; }
        .approval-label { color: #888; min-width: 56px; flex-shrink: 0; font-weight: 500; }
        .approval-value { color: #333; font-weight: 500; }
        .approval-value.amount { color: #d35400; font-size: 20px; font-weight: 700; font-family: "SF Mono", "Menlo", monospace; letter-spacing: -0.5px; }

        .approval-actions {
            padding: 14px 18px;
            display: flex;
            gap: 12px;
            border-top: 1px solid #eee;
            background: #fafafa;
        }
        .approval-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .approval-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn-approve { background: #43a047; color: white; }
        .btn-approve:hover:not(:disabled) { background: #388e3c; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(67, 160, 71, 0.35); }
        .btn-approve:active:not(:disabled) { transform: translateY(0); }
        .btn-reject { background: white; color: #e53935; border: 2px solid #e53935; }
        .btn-reject:hover:not(:disabled) { background: #ffebee; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(229, 57, 53, 0.18); }
        .btn-reject:active:not(:disabled) { transform: translateY(0); }

        .approval-status {
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            border-top: 1px solid #eee;
            background: #fafafa;
        }
        .approval-status.processing { color: #e67e22; }
        .approval-status.approved-status { color: #2e7d32; background: #f1f8e9; }
        .approval-status.rejected-status { color: #c62828; background: #fff5f5; }

        /* Type badge */
        .type-badge { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: 600; color: white; margin-left: 6px; vertical-align: middle; }
        .type-badge.refund { background: #e53935; }
        .type-badge.replacement { background: #1976d2; }
        .type-badge.issue_coupon { background: #7b1fa2; }

        /* Error card */
        .err-card { border-color: #ffcdd2 !important; background: #fff5f5 !important; }
        .err-summary { color: #c62828; font-size: 13px; line-height: 1.5; }
        .err-detail { margin-top: 8px; cursor: pointer; }
        .err-detail pre { display: none; margin-top: 6px; font-size: 11px; color: #555; background: #f7f7f8; border-radius: 6px; padding: 8px 10px; font-family: "SF Mono", "Menlo", monospace; line-height: 1.6; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .err-detail.expanded pre { display: block; }
        .err-detail.expanded .err-toggle { transform: rotate(90deg); }
        .err-toggle { font-size: 12px; color: #999; transition: transform 0.2s; display: inline-block; }

        .loading-card { background: white; border: 1px solid #e8e8ec; border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 10px; }
        .loading-card .spinner-lg { width: 18px; height: 18px; border: 2px solid #ffe0b2; border-top-color: #e67e22; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .loading-card span { font-size: 13px; color: #888; }

        .input-area { padding: 14px 24px; background: white; border-top: 1px solid #e8e8ec; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 10px 16px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none; transition: border-color 0.2s; font-family: inherit; }
        .input-area input:focus { border-color: #e67e22; }
        .input-area input:disabled { background: #f5f5f5; }
        .input-area button { padding: 10px 24px; background: #e67e22; color: white; border: none; border-radius: 20px; font-size: 14px; cursor: pointer; transition: background 0.2s; font-family: inherit; }
        .input-area button:hover { background: #d35400; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }

        .quick-asks { padding: 8px 24px; display: flex; gap: 8px; flex-wrap: wrap; }
        .quick-asks button { padding: 6px 14px; background: white; border: 1px solid #ddd; border-radius: 16px; font-size: 12px; cursor: pointer; color: #555; transition: all 0.2s; font-family: inherit; }
        .quick-asks button:hover { background: #fff3e0; border-color: #e67e22; color: #d35400; }

        .welcome { background: white; border: 1px solid #e8e8ec; border-radius: 12px; padding: 24px; max-width: 540px; margin: 40px auto; text-align: center; }
        .welcome h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 10px; }
        .welcome .subtitle { font-size: 13px; color: #e67e22; font-weight: 600; margin-bottom: 8px; }
        .welcome p { font-size: 13px; color: #666; line-height: 1.7; }
        .welcome .flow {
            margin-top: 16px;
            font-size: 12px;
            color: #d35400;
            font-family: "SF Mono", "Menlo", monospace;
            background: #fff3e0;
            border-radius: 10px;
            padding: 14px 16px;
            line-height: 2;
            text-align: left;
            border: 1px solid #ffe0b2;
        }
        .welcome .flow .safe { color: #2e7d32; font-weight: 600; }
        .welcome .flow .danger { color: #c62828; font-weight: 600; }
        .welcome .compare { margin-top: 14px; font-size: 12px; color: #888; text-align: left; line-height: 1.8; }
        .welcome .compare span.old { color: #999; text-decoration: line-through; }
        .welcome .compare span.new { color: #e67e22; font-weight: 600; }

        .round-badge { display: inline-block; font-size: 11px; color: #999; background: #f0f0f2; padding: 2px 10px; border-radius: 10px; margin-bottom: 6px; font-family: "SF Mono", "Menlo", monospace; }

        @media (max-width: 640px) {
            .header { padding: 12px 16px; }
            .header p { font-size: 11px; }
            .chat-area { padding: 16px; }
            .input-area { padding: 12px 16px; }
            .quick-asks { padding: 8px 16px; }
            .msg-user .bubble { max-width: 80%; }
            .msg-ai { max-width: 95%; }
            .approval-actions { flex-direction: column; }
            .welcome { margin: 20px auto; padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="badge">项目 4</span>
        <h1>售后 Agent (HITL)</h1>
        <p>Agent Loop + 人工审批门控</p>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="welcome">
            <div class="subtitle">Human-in-the-Loop</div>
            <h2>售后 Agent</h2>
            <p>这不是普通的聊天机器人。售后 Agent 能自主调用工具查订单、分析情况，但遇到<strong>高风险操作</strong>（退款、换货、发优惠券）时，会<strong>暂停执行</strong>并等待人工审批。</p>
            <div class="flow">
                用户提问 → Agent 分析（查订单、评估情况）<br>
                → <span class="safe">安全操作: 直接执行（查询信息等）</span><br>
                → <span class="danger">危险操作: 暂停 → 等待人工审批 → 批准/拒绝 → 继续执行</span>
            </div>
            <div class="compare">
                <div><span class="old">传统客服: 所有操作都需要人工判断和执行</span></div>
                <div><span class="new">HITL Agent: 自动处理常规请求，仅在高风险操作时请求人工审批</span></div>
            </div>
        </div>
    </div>

    <div class="quick-asks" id="quickAsks"></div>

    <div class="input-area">
        <input type="text" id="queryInput" placeholder="描述你的售后问题..." onkeydown="if(event.key==='Enter')sendQuery()">
        <button id="sendBtn" onclick="sendQuery()">发送</button>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════
    // State
    // ═══════════════════════════════════════════════════════
    let currentSessionId = null;

    const TYPE_LABELS = {
        refund: '退款',
        replacement: '换货',
        issue_coupon: '发放优惠券',
    };

    const TYPE_LABEL_CLASSES = {
        refund: 'refund',
        replacement: 'replacement',
        issue_coupon: 'issue_coupon',
    };

    // ═══════════════════════════════════════════════════════
    // Quick Asks
    // ═══════════════════════════════════════════════════════
    const QUICK_ASKS = [
        '订单3的商品有质量问题，我想退款',
        '订单5发错货了，需要换货',
        '订单1物流太慢了，能补偿吗',
        '帮我查一下订单2的信息',
        '订单4不想要了，怎么处理',
    ];

    (function init() {
        const container = document.getElementById('quickAsks');
        QUICK_ASKS.forEach(text => {
            const btn = document.createElement('button');
            btn.textContent = text.length > 16 ? text.slice(0, 16) + '...' : text;
            btn.title = text;
            btn.onclick = () => {
                document.getElementById('queryInput').value = text;
                sendQuery();
            };
            container.appendChild(btn);
        });
    })();

    // ═══════════════════════════════════════════════════════
    // Main send flow
    // ═══════════════════════════════════════════════════════
    async function sendQuery() {
        const input = document.getElementById('queryInput');
        const query = input.value.trim();
        if (!query) return;
        input.value = '';

        const welcome = document.querySelector('.welcome');
        if (welcome) welcome.remove();

        appendUserMsg(query);
        const loadingEl = appendLoading('正在分析您的问题...');
        setInputEnabled(false);

        try {
            const body = { message: query };
            if (currentSessionId) body.session_id = currentSessionId;

            const resp = await fetch('/api/v4/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(body),
            });
            let data;
            try { data = await resp.json(); } catch { data = null; }
            loadingEl.remove();

            if (!resp.ok) {
                appendErrorMsg(data?.message || data?.error || 'HTTP ' + resp.status, data);
            } else if (data?.error) {
                appendErrorMsg(data.error, data);
            } else {
                if (data.session_id) currentSessionId = data.session_id;
                await animateResponse(data);
            }
        } catch (e) {
            loadingEl.remove();
            appendErrorMsg('网络请求失败: ' + e.message, { hint: '请确认后端服务是否在运行' });
        }
        setInputEnabled(true);
    }

    // ═══════════════════════════════════════════════════════
    // Approval flow
    // ═══════════════════════════════════════════════════════
    async function handleApproval(approved) {
        if (!currentSessionId) return;

        const panel = document.getElementById('approval-panel-' + currentSessionId);
        if (!panel) return;

        const approveBtn = panel.querySelector('.btn-approve');
        const rejectBtn = panel.querySelector('.btn-reject');
        const actionsDiv = panel.querySelector('.approval-actions');

        approveBtn.disabled = true;
        rejectBtn.disabled = true;

        actionsDiv.outerHTML = '<div class="approval-status processing">' +
            '<div class="spinner"></div>' +
            '<span>' + (approved ? '已批准，Agent 正在执行...' : '已拒绝，正在通知 Agent...') + '</span>' +
            '</div>';

        setInputEnabled(false);

        try {
            const resp = await fetch('/api/v4/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ session_id: currentSessionId, approved: approved }),
            });
            let data;
            try { data = await resp.json(); } catch { data = null; }

            if (!resp.ok || data?.error) {
                const statusDiv = panel.querySelector('.approval-status');
                if (statusDiv) {
                    statusDiv.className = 'approval-status rejected-status';
                    statusDiv.innerHTML = '<span>操作失败: ' + esc(data?.error || data?.message || 'HTTP ' + resp.status) + '</span>';
                }
                setInputEnabled(true);
                return;
            }

            if (approved) {
                panel.classList.add('approved');
                const statusDiv = panel.querySelector('.approval-status');
                if (statusDiv) {
                    statusDiv.className = 'approval-status approved-status';
                    statusDiv.innerHTML = '<span>&#10003; 已批准 — 操作已成功执行</span>';
                }
            } else {
                panel.classList.add('rejected');
                const statusDiv = panel.querySelector('.approval-status');
                if (statusDiv) {
                    statusDiv.className = 'approval-status rejected-status';
                    statusDiv.innerHTML = '<span>&#10007; 已拒绝 — 操作已取消</span>';
                }
            }

            if (data.session_id) currentSessionId = data.session_id;

            if (data.steps || data.answer) {
                await animateFinalResponse(data);
            }

            // Reset session for next conversation
            currentSessionId = null;

        } catch (e) {
            const statusDiv = panel.querySelector('.approval-status');
            if (statusDiv) {
                statusDiv.className = 'approval-status rejected-status';
                statusDiv.innerHTML = '<span>网络错误: ' + esc(e.message) + '</span>';
            }
        }
        setInputEnabled(true);
    }

    async function animateFinalResponse(data) {
        const chat = document.getElementById('chatArea');
        const aiDiv = document.createElement('div');
        aiDiv.className = 'msg-ai';

        const steps = buildStepsFromData(data);

        if (steps.length > 0) {
            const totalTime = steps.reduce((s, st) => s + (st.duration_ms || 0), 0);

            const panel = document.createElement('div');
            panel.className = 'steps-panel';

            const header = document.createElement('div');
            header.className = 'steps-header';
            header.innerHTML = '<span class="toggle-icon">&#9660;</span>' +
                '<span class="steps-summary">' + steps.length + ' 个步骤</span>' +
                '<span class="total-time">' + (totalTime ? totalTime + 'ms' : '') + '</span>';
            panel.appendChild(header);

            const body = document.createElement('div');
            body.className = 'steps-body';

            const stepEls = steps.map(function(step) {
                const el = document.createElement('div');
                el.className = 'step';
                const iconClass = step.icon || 'done';
                const iconContent = getStepIconContent(iconClass);
                el.innerHTML = '<div class="step-icon ' + iconClass + '">' + iconContent + '</div>' +
                    '<div class="step-info">' +
                        '<div class="step-row">' +
                            '<span class="step-name">' + esc(step.name) + '</span>' +
                            '<span class="step-time">' + (step.duration_ms ? step.duration_ms + 'ms' : '') + '</span>' +
                        '</div>' +
                        '<div class="step-detail">' + esc(step.detailText || '') + '</div>' +
                    '</div>';
                body.appendChild(el);
                return el;
            });

            panel.appendChild(body);
            aiDiv.appendChild(panel);

            if (data.answer) {
                const resultDiv = document.createElement('div');
                resultDiv.className = 'result-area';
                resultDiv.innerHTML = renderAnswer(data.answer);
                aiDiv.appendChild(resultDiv);
            }

            chat.appendChild(aiDiv);
            chat.scrollTop = chat.scrollHeight;

            for (let i = 0; i < stepEls.length; i++) {
                await delay(80);
                stepEls[i].classList.add('visible');
                chat.scrollTop = chat.scrollHeight;
                await delay(100);
            }

            stepEls.forEach(function(el) {
                el.querySelector('.step-row').addEventListener('click', function() {
                    el.classList.toggle('expanded');
                });
            });

            let collapsed = true;
            body.classList.add('collapsed');
            header.querySelector('.toggle-icon').classList.add('collapsed');
            header.querySelector('.steps-summary').textContent = steps.length + ' 个步骤 · 点击展开';

            header.addEventListener('click', function() {
                collapsed = !collapsed;
                body.classList.toggle('collapsed', collapsed);
                header.querySelector('.toggle-icon').classList.toggle('collapsed', collapsed);
                header.querySelector('.steps-summary').textContent =
                    collapsed ? steps.length + ' 个步骤 · 点击展开' : steps.length + ' 个步骤';
            });

            if (data.answer) {
                await delay(150);
                const resultDiv = aiDiv.querySelector('.result-area');
                if (resultDiv) resultDiv.classList.add('visible');
                chat.scrollTop = chat.scrollHeight;
            }
        } else if (data.answer) {
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result-area';
            resultDiv.innerHTML = renderAnswer(data.answer);
            aiDiv.appendChild(resultDiv);
            chat.appendChild(aiDiv);
            await delay(100);
            resultDiv.classList.add('visible');
            chat.scrollTop = chat.scrollHeight;
        }
    }

    // ═══════════════════════════════════════════════════════
    // Animate response (steps + result/approval)
    // ═══════════════════════════════════════════════════════
    async function animateResponse(data) {
        const chat = document.getElementById('chatArea');
        const aiDiv = document.createElement('div');
        aiDiv.className = 'msg-ai';

        // Round badge
        if (data.rounds) {
            const roundBadge = document.createElement('div');
            roundBadge.className = 'round-badge';
            roundBadge.textContent = '第 ' + data.rounds + ' 轮对话';
            aiDiv.appendChild(roundBadge);
        }

        const steps = buildStepsFromData(data);
        const totalTime = steps.reduce(function(s, st) { return s + (st.duration_ms || 0); }, 0);

        if (steps.length > 0) {
            const panel = document.createElement('div');
            panel.className = 'steps-panel';

            const header = document.createElement('div');
            header.className = 'steps-header';
            header.innerHTML = '<span class="toggle-icon">&#9660;</span>' +
                '<span class="steps-summary">' + steps.length + ' 个步骤</span>' +
                '<span class="total-time">' + (totalTime ? totalTime + 'ms' : '') + '</span>';
            panel.appendChild(header);

            const body = document.createElement('div');
            body.className = 'steps-body';

            const stepEls = steps.map(function(step) {
                const el = document.createElement('div');
                el.className = 'step';
                const iconClass = step.icon || 'done';
                const iconContent = getStepIconContent(iconClass);
                el.innerHTML = '<div class="step-icon ' + iconClass + '">' + iconContent + '</div>' +
                    '<div class="step-info">' +
                        '<div class="step-row">' +
                            '<span class="step-name">' + esc(step.name) + '</span>' +
                            '<span class="step-time">' + (step.duration_ms ? step.duration_ms + 'ms' : '') + '</span>' +
                        '</div>' +
                        '<div class="step-detail">' + esc(step.detailText || '') + '</div>' +
                    '</div>';
                body.appendChild(el);
                return el;
            });

            panel.appendChild(body);
            aiDiv.appendChild(panel);

            // Result area or approval panel
            let resultOrApproval;
            if (data.status === 'pending_approval' && data.approval_request) {
                resultOrApproval = createApprovalPanel(data);
            } else {
                resultOrApproval = document.createElement('div');
                resultOrApproval.className = 'result-area';
                resultOrApproval.innerHTML = renderAnswer(data.answer);
            }
            aiDiv.appendChild(resultOrApproval);

            chat.appendChild(aiDiv);
            chat.scrollTop = chat.scrollHeight;

            // Animate steps
            for (let i = 0; i < stepEls.length; i++) {
                await delay(80);
                stepEls[i].classList.add('visible');
                chat.scrollTop = chat.scrollHeight;

                if (steps[i].icon === 'running') {
                    const animTime = Math.min(600, Math.max(200, (steps[i].duration_ms || 300) * 0.3));
                    await delay(animTime);
                    const icon = stepEls[i].querySelector('.step-icon');
                    icon.className = 'step-icon done';
                    icon.innerHTML = '&#10003;';
                } else {
                    await delay(100);
                }
            }

            stepEls.forEach(function(el) {
                el.querySelector('.step-row').addEventListener('click', function() {
                    el.classList.toggle('expanded');
                });
            });

            // Collapse by default
            let collapsed = true;
            body.classList.add('collapsed');
            header.querySelector('.toggle-icon').classList.add('collapsed');
            header.querySelector('.steps-summary').textContent = steps.length + ' 个步骤 · 点击展开';

            header.addEventListener('click', function() {
                collapsed = !collapsed;
                body.classList.toggle('collapsed', collapsed);
                header.querySelector('.toggle-icon').classList.toggle('collapsed', collapsed);
                header.querySelector('.steps-summary').textContent =
                    collapsed ? steps.length + ' 个步骤 · 点击展开' : steps.length + ' 个步骤';
            });

            await delay(150);
            if (resultOrApproval.classList.contains('result-area')) {
                resultOrApproval.classList.add('visible');
            }
            chat.scrollTop = chat.scrollHeight;
        } else {
            // No steps
            let resultOrApproval;
            if (data.status === 'pending_approval' && data.approval_request) {
                resultOrApproval = createApprovalPanel(data);
            } else {
                resultOrApproval = document.createElement('div');
                resultOrApproval.className = 'result-area';
                resultOrApproval.innerHTML = renderAnswer(data.answer);
            }
            aiDiv.appendChild(resultOrApproval);
            chat.appendChild(aiDiv);
            await delay(100);
            if (resultOrApproval.classList.contains('result-area')) {
                resultOrApproval.classList.add('visible');
            }
            chat.scrollTop = chat.scrollHeight;
        }
    }

    // ═══════════════════════════════════════════════════════
    // Build steps from API response
    // ═══════════════════════════════════════════════════════
    function buildStepsFromData(data) {
        const steps = [];
        const rawSteps = data.steps || [];

        for (let i = 0; i < rawSteps.length; i++) {
            const s = rawSteps[i];
            if (s.type === 'tool_call') {
                steps.push({
                    name: '调用工具: ' + (s.tool || 'unknown'),
                    icon: 'tool',
                    duration_ms: s.duration_ms || 0,
                    detailText: formatToolArgs(s.tool, s.args),
                });
            } else if (s.type === 'tool_result') {
                steps.push({
                    name: '工具返回结果',
                    icon: 'result',
                    duration_ms: s.duration_ms || 0,
                    detailText: formatToolResult(s.result),
                });
            } else if (s.type === 'answer') {
                steps.push({
                    name: '生成回答',
                    icon: 'answer',
                    duration_ms: s.duration_ms || 0,
                    detailText: (s.content || '').slice(0, 200),
                });
            } else if (s.type === 'thinking' || s.type === 'analysis') {
                steps.push({
                    name: s.name || '分析中',
                    icon: 'running',
                    duration_ms: s.duration_ms || 0,
                    detailText: s.content || s.detail || '',
                });
            } else {
                steps.push({
                    name: s.name || s.type || '步骤',
                    icon: 'done',
                    duration_ms: s.duration_ms || 0,
                    detailText: s.detail ? (typeof s.detail === 'string' ? s.detail : JSON.stringify(s.detail, null, 2)) : '',
                });
            }
        }

        if (data.status === 'pending_approval' && data.approval_request) {
            steps.push({
                name: '⚠ 需要人工审批',
                icon: 'running',
                duration_ms: 0,
                detailText: '操作类型: ' + (TYPE_LABELS[data.approval_request.type] || data.approval_request.type) + '\n等待人工确认后继续执行',
            });
        }

        return steps;
    }

    function formatToolArgs(tool, args) {
        let text = '工具: ' + (tool || 'unknown') + '\n';
        if (args && typeof args === 'object') {
            text += '参数: ' + JSON.stringify(args, null, 2);
        }
        return text;
    }

    function formatToolResult(result) {
        if (typeof result === 'string') return result;
        return JSON.stringify(result, null, 2);
    }

    function getStepIconContent(iconClass) {
        switch (iconClass) {
            case 'tool': return '&#128295;';
            case 'result': return '&#128203;';
            case 'answer': return '&#10003;';
            case 'running': return '<div class="spinner"></div>';
            case 'done': return '&#10003;';
            default: return '&#10003;';
        }
    }

    // ═══════════════════════════════════════════════════════
    // Create approval panel
    // ═══════════════════════════════════════════════════════
    function createApprovalPanel(data) {
        const req = data.approval_request;
        const type = req.type || 'unknown';
        const params = req.params || {};
        const reason = req.reason || '';

        const panel = document.createElement('div');
        panel.className = 'approval-panel';
        panel.id = 'approval-panel-' + (data.session_id || 'temp');

        // Header
        const headerDiv = document.createElement('div');
        headerDiv.className = 'approval-header';
        headerDiv.innerHTML = '<span class="approval-header-icon">&#9888;&#65039;</span>' +
            '<span class="approval-header-text">AI 请求操作审批</span>' +
            '<span class="approval-header-sub">需要人工确认后才能执行</span>';
        panel.appendChild(headerDiv);

        // Body
        const bodyDiv = document.createElement('div');
        bodyDiv.className = 'approval-body';

        // Operation field
        bodyDiv.innerHTML += '<div class="approval-field">' +
            '<span class="approval-label">操作:</span>' +
            '<span class="approval-value">' + esc(TYPE_LABELS[type] || type) +
            ' <span class="type-badge ' + (TYPE_LABEL_CLASSES[type] || '') + '">' + esc(type) + '</span></span>' +
            '</div>';

        if (params.order_id !== undefined) {
            bodyDiv.innerHTML += '<div class="approval-field">' +
                '<span class="approval-label">订单:</span>' +
                '<span class="approval-value">#' + esc(String(params.order_id)) + '</span>' +
                '</div>';
        }
        if (params.amount !== undefined) {
            bodyDiv.innerHTML += '<div class="approval-field">' +
                '<span class="approval-label">金额:</span>' +
                '<span class="approval-value amount">&yen;' + Number(params.amount).toFixed(2) + '</span>' +
                '</div>';
        }
        if (params.reason) {
            bodyDiv.innerHTML += '<div class="approval-field">' +
                '<span class="approval-label">理由:</span>' +
                '<span class="approval-value">' + esc(params.reason) + '</span>' +
                '</div>';
        } else if (reason) {
            bodyDiv.innerHTML += '<div class="approval-field">' +
                '<span class="approval-label">理由:</span>' +
                '<span class="approval-value">' + esc(reason) + '</span>' +
                '</div>';
        }

        // Extra params
        const knownKeys = { order_id: true, amount: true, reason: true };
        for (const k of Object.keys(params)) {
            if (!knownKeys[k]) {
                bodyDiv.innerHTML += '<div class="approval-field">' +
                    '<span class="approval-label">' + esc(k) + ':</span>' +
                    '<span class="approval-value">' + esc(String(params[k])) + '</span>' +
                    '</div>';
            }
        }

        panel.appendChild(bodyDiv);

        // Agent's text answer preview (if any)
        if (data.answer) {
            const answerDiv = document.createElement('div');
            answerDiv.style.cssText = 'padding: 12px 18px; border-top: 1px solid #eee; font-size: 13px; color: #555; line-height: 1.6;';
            answerDiv.innerHTML = renderAnswer(data.answer);
            panel.appendChild(answerDiv);
        }

        // Actions
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'approval-actions';
        actionsDiv.innerHTML = '<button class="approval-btn btn-approve" onclick="handleApproval(true)">' +
            '<span>&#10003;</span> 批准</button>' +
            '<button class="approval-btn btn-reject" onclick="handleApproval(false)">' +
            '<span>&#10007;</span> 拒绝</button>';
        panel.appendChild(actionsDiv);

        return panel;
    }

    // ═══════════════════════════════════════════════════════
    // Render helpers
    // ═══════════════════════════════════════════════════════
    function renderAnswer(text) {
        if (!text) return '';
        return '<div class="agent-answer">' + esc(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>') + '</div>';
    }

    function appendUserMsg(text) {
        const chat = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg-user';
        div.innerHTML = '<div class="bubble">' + esc(text) + '</div>';
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function appendLoading(text) {
        const chat = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg-ai';
        div.innerHTML = '<div class="loading-card"><div class="spinner-lg"></div><span>' + esc(text || '处理中...') + '</span></div>';
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function appendErrorMsg(summary, detail) {
        const chat = document.getElementById('chatArea');
        const div = document.createElement('div');
        div.className = 'msg-ai';
        let detailHtml = '';
        if (detail) {
            const lines = [];
            if (detail.exception) lines.push('异常: ' + detail.exception);
            if (detail.file) lines.push('文件: ' + detail.file);
            if (detail.line) lines.push('行号: ' + detail.line);
            if (detail.hint) lines.push('提示: ' + detail.hint);
            const detailText = lines.length ? lines.join('\n') : JSON.stringify(detail, null, 2);
            detailHtml = '<div class="err-detail" onclick="this.classList.toggle(\'expanded\')">' +
                '<span class="err-toggle">&#9656; 查看详情</span>' +
                '<pre>' + esc(detailText) + '</pre>' +
                '</div>';
        }
        div.innerHTML = '<div class="result-area visible err-card">' +
            '<div class="err-summary">&#9888; ' + esc(summary) + '</div>' + detailHtml +
            '</div>';
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function setInputEnabled(enabled) {
        document.getElementById('sendBtn').disabled = !enabled;
        document.getElementById('queryInput').disabled = !enabled;
    }

    function delay(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

    function esc(str) {
        const d = document.createElement('div');
        d.textContent = str ?? '';
        return d.innerHTML;
    }
    </script>
</body>
