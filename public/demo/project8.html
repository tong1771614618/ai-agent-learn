<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P08 - MCP + SRE Agent (自动化运维)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0e14; color: #c9d1d9; min-height: 100vh; }

        .header { background: linear-gradient(135deg, #0d1117, #161b22); padding: 14px 24px; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 18px; color: #39d353; font-family: 'SF Mono', monospace; }
        .header .badge { background: #238636; color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
        .header .tag { background: #23863622; color: #39d353; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-family: monospace; }
        .header .mcp-status { margin-left: auto; font-size: 12px; color: #8b949e; }
        .header .mcp-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
        .header .mcp-status .dot.online { background: #39d353; }
        .header .mcp-status .dot.offline { background: #f85149; }

        .main { display: flex; height: calc(100vh - 52px); }
        .chat-panel { flex: 1; display: flex; flex-direction: column; }
        .side-panel { width: 320px; border-left: 1px solid #21262d; display: flex; flex-direction: column; }

        /* 对话区 */
        .messages { flex: 1; overflow-y: auto; padding: 16px; }
        .msg { margin-bottom: 16px; max-width: 85%; }
        .msg.user { margin-left: auto; }
        .msg .role { font-size: 11px; color: #8b949e; margin-bottom: 4px; font-family: monospace; }
        .msg .bubble { padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.6; }
        .msg.user .bubble { background: #1f6feb; color: #fff; border-radius: 10px 10px 2px 10px; }
        .msg.agent .bubble { background: #161b22; border: 1px solid #21262d; border-radius: 10px 10px 10px 2px; }
        .msg.system .bubble { background: #1c2128; border: 1px solid #238636; font-family: 'SF Mono', monospace; font-size: 12px; color: #39d353; }

        /* 步骤展示 */
        .step-item { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 8px 12px; margin: 6px 0; font-size: 12px; font-family: 'SF Mono', monospace; }
        .step-item .tool-name { color: #d2a8ff; font-weight: 600; }
        .step-item .tool-result { color: #8b949e; margin-top: 4px; white-space: pre-wrap; max-height: 120px; overflow-y: auto; font-size: 11px; }

        /* 输入区 */
        .input-bar { padding: 12px 16px; border-top: 1px solid #21262d; display: flex; gap: 8px; }
        .input-bar input { flex: 1; background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
        .input-bar input:focus { border-color: #238636; }
        .input-bar button { background: #238636; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .input-bar button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

        /* 侧栏 */
        .side-title { padding: 12px 16px; border-bottom: 1px solid #21262d; font-size: 13px; font-weight: 600; color: #f0f6fc; font-family: monospace; }
        .tools-list { flex: 1; overflow-y: auto; padding: 8px; }
        .tool-card { background: #161b22; border: 1px solid #21262d; border-radius: 6px; padding: 10px 12px; margin-bottom: 6px; }
        .tool-card .name { font-size: 13px; font-weight: 600; font-family: monospace; }
        .tool-card .name.safe { color: #39d353; }
        .tool-card .name.danger { color: #f85149; }
        .tool-card .desc { font-size: 11px; color: #8b949e; margin-top: 4px; }

        /* 确认面板 */
        .confirm-panel { display: none; border-top: 1px solid #f85149; background: #1c0d0d; padding: 12px 16px; }
        .confirm-panel.active { display: block; }
        .confirm-panel h4 { color: #f85149; font-size: 14px; margin-bottom: 8px; }
        .confirm-panel .detail { font-size: 12px; color: #8b949e; margin-bottom: 10px; font-family: monospace; }
        .confirm-panel .buttons { display: flex; gap: 8px; }
        .confirm-panel .btn-confirm { background: #238636; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .confirm-panel .btn-cancel { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 20px; border-radius: 6px; cursor: pointer; }

        .placeholder { text-align: center; padding: 60px 20px; color: #484f58; }
        .placeholder .icon { font-size: 48px; margin-bottom: 12px; }

        /* 快捷问题 */
        .quick-asks { padding: 8px 16px; border-top: 1px solid #21262d; display: flex; gap: 6px; flex-wrap: wrap; }
        .quick-asks button { background: #161b22; border: 1px solid #21262d; color: #8b949e; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .quick-asks button:hover { border-color: #238636; color: #39d353; }
    </style>
</head>
<body>
    <div class="header">
        <h1>$ sre-agent</h1>
        <span class="badge">项目 8</span>
        <span class="tag">MCP Protocol</span>
        <span class="tag">Guardrails</span>
        <span class="mcp-status" id="mcpStatus"><span class="dot offline" id="mcpDot"></span>MCP Server</span>
    </div>

    <div class="main">
        <div class="chat-panel">
            <div class="messages" id="messages">
                <div class="placeholder">
                    <div class="icon">🖥️</div>
                    <p>DevShop SRE Agent 待命中<br>描述系统问题，Agent 将通过 MCP 工具自动诊断</p>
                </div>
            </div>

            <div class="quick-asks">
                <button onclick="ask('系统负载怎么样？帮我查一下')">系统负载</button>
                <button onclick="ask('检查一下磁盘空间')">磁盘空间</button>
                <button onclick="ask('MySQL 数据库连接正常吗？')">MySQL 状态</button>
                <button onclick="ask('nginx 进程在运行吗？')">Nginx 进程</button>
                <button onclick="ask('系统好像变慢了，帮我全面诊断一下')">全面诊断</button>
            </div>

            <div class="input-bar">
                <input type="text" id="msgInput" placeholder="描述系统问题..." onkeydown="if(event.key==='Enter') sendMsg()">
                <button id="sendBtn" onclick="sendMsg()">发送</button>
            </div>

            <div class="confirm-panel" id="confirmPanel">
                <h4>⚠ 危险操作确认</h4>
                <div class="detail" id="confirmDetail"></div>
                <div class="buttons">
                    <button class="btn-confirm" onclick="doConfirm(true)">确认执行</button>
                    <button class="btn-cancel" onclick="doConfirm(false)">取消</button>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="side-title">// MCP Tools</div>
            <div class="tools-list" id="toolsList">
                <div style="padding: 16px; color: #484f58; font-size: 12px;">等待 MCP Server 连接...</div>
            </div>
        </div>
    </div>

<script>
const API_BASE = 'http://127.0.0.1:8001';
let currentSessionId = null;

// ─── 工具列表（硬编码展示，实际从 MCP Server 发现）──────────
const TOOLS = [
    { name: 'check_disk_usage', desc: '检查磁盘使用情况', safe: true },
    { name: 'check_system_load', desc: '检查系统负载（CPU/内存/进程）', safe: true },
    { name: 'check_process', desc: '检查指定进程是否在运行', safe: true },
    { name: 'read_logs', desc: '读取日志文件（排查异常）', safe: true },
    { name: 'check_mysql', desc: '检查 MySQL 连接状态', safe: true },
    { name: 'restart_service', desc: '⚠ 重启服务（可能导致中断）', safe: false },
];

// 渲染工具列表
function renderTools() {
    const el = document.getElementById('toolsList');
    el.innerHTML = TOOLS.map(t => `
        <div class="tool-card">
            <div class="name ${t.safe ? 'safe' : 'danger'}">${t.safe ? '✓' : '⚠'} ${t.name}</div>
            <div class="desc">${t.desc}</div>
        </div>
    `).join('');
}
renderTools();

// 检查 MCP Server 状态
async function checkMCP() {
    try {
        const resp = await fetch(API_BASE + '/p08/diagnose', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'ping' }),
        });
        document.getElementById('mcpDot').className = 'dot online';
    } catch {
        document.getElementById('mcpDot').className = 'dot offline';
    }
}
checkMCP();

function ask(text) {
    document.getElementById('msgInput').value = text;
    sendMsg();
}

function addMessage(role, content, steps) {
    const el = document.getElementById('messages');
    if (el.querySelector('.placeholder')) el.innerHTML = '';

    let stepsHtml = '';
    if (steps && steps.length) {
        stepsHtml = steps.map(s => {
            if (s.type === 'tool_call') {
                return `<div class="step-item">→ <span class="tool-name">${s.tool}</span>(${JSON.stringify(s.args)})</div>`;
            } else if (s.type === 'tool_result') {
                const preview = JSON.stringify(s.result, null, 2).slice(0, 300);
                return `<div class="step-item"><div class="tool-result">${preview}</div></div>`;
            }
            return '';
        }).join('');
    }

    const cssClass = role === 'user' ? 'user' : role === 'system' ? 'system' : 'agent';
    el.innerHTML += `
        <div class="msg ${cssClass}">
            <div class="role">${role === 'user' ? '> you' : role === 'system' ? '> system' : '> sre-agent'}</div>
            <div class="bubble">${formatText(content)}</div>
            ${stepsHtml}
        </div>
    `;
    el.scrollTop = el.scrollHeight;
}

function formatText(text) {
    if (!text) return '';
    return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code style="background:#0d1117;padding:1px 4px;border-radius:3px;font-size:12px;">$1</code>')
        .replace(/\n/g, '<br>');
}

async function sendMsg() {
    const input = document.getElementById('msgInput');
    const btn = document.getElementById('sendBtn');
    const msg = input.value.trim();
    if (!msg) return;

    input.value = '';
    btn.disabled = true;
    addMessage('user', msg);

    try {
        const resp = await fetch(API_BASE + '/p08/diagnose', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, session_id: currentSessionId }),
        });
        const data = await resp.json();
        currentSessionId = data.session_id;

        if (data.status === 'error') {
            addMessage('system', data.answer);
        } else if (data.status === 'pending_confirmation') {
            addMessage('agent', '需要执行危险操作...', data.steps);
            const panel = document.getElementById('confirmPanel');
            const detail = document.getElementById('confirmDetail');
            const cr = data.confirmation_request;
            detail.innerHTML = `<strong>${cr.tool}</strong><br>${JSON.stringify(cr.arguments, null, 2)}<br><br>${cr.reason}`;
            panel.classList.add('active');
        } else {
            addMessage('agent', data.answer, data.steps);
        }
    } catch (e) {
        addMessage('system', '请求失败: ' + e.message);
    } finally {
        btn.disabled = false;
    }
}

async function doConfirm(confirmed) {
    document.getElementById('confirmPanel').classList.remove('active');
    addMessage('system', confirmed ? '✓ 已确认执行' : '✗ 已取消操作');

    try {
        const resp = await fetch(API_BASE + '/p08/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentSessionId, confirmed }),
        });
        const data = await resp.json();
        addMessage('agent', data.answer, data.steps);
    } catch (e) {
        addMessage('system', '确认请求失败: ' + e.message);
    }
}
</script>
</body>
</html>
